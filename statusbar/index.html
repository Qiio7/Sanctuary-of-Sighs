<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg-panel: rgba(20, 22, 35, 0.6);
    --card-bg: rgba(35, 40, 60, 0.4);
    --card-hover: rgba(45, 50, 75, 0.6);
    --border: rgba(255, 255, 255, 0.1);
    --txt: #e2e2e8;
    --sub: #9ba1b0;
    --accent: #9d4edd;
    --warn: #f59e0b;
    --danger: #ef4444;
    --safe: #10b981;
    --bar-bg: rgba(0, 0, 0, 0.5);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0f1015;
    color: var(--txt);
    font: 13px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif;
    padding: 20px;
    min-height: 200px;
  }
  .panel {
    width: 100%; max-width: 420px; margin:0 auto;
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .weather-bar {
    background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px; margin-bottom: 12px;
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:#c7d2fe; font-weight:500;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .section-label {
    font-size:11px; color:var(--sub); margin:12px 0 6px 4px;
    letter-spacing:1px; text-transform:uppercase;
  }
  .npc-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px; padding:12px 14px; margin-bottom:8px;
    border-left: 4px solid transparent;
    transition: all 0.3s ease;
  }
  .npc-card:hover { background: var(--card-hover); transform: translateX(2px); }
  .npc-card.present { border-left-color: var(--accent); box-shadow: -2px 0 10px rgba(157,78,221,0.2); }
  .npc-card.absent { opacity:0.55; border-left-color:var(--border); filter:grayscale(50%); }
  .npc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .npc-name { font-size:15px; font-weight:700; display:flex; align-items:center; letter-spacing:0.5px; }
  .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; box-shadow:0 0 5px currentColor; }
  .status-dot.on { background:var(--safe); color:var(--safe); }
  .status-dot.off { background:var(--sub); color:transparent; box-shadow:none; }
  .npc-stage { font-size:11px; color:var(--txt); background:rgba(255,255,255,0.1); padding:3px 8px; border-radius:12px; }
  .aff-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .aff-bar { flex:1; height:8px; background:var(--bar-bg); border-radius:4px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,0.5); }
  .aff-fill { height:100%; border-radius:4px; transition:width 0.8s cubic-bezier(0.4,0,0.2,1); }
  .aff-fill.low { background:var(--danger); box-shadow:0 0 8px var(--danger); }
  .aff-fill.mid { background:var(--warn); box-shadow:0 0 8px var(--warn); }
  .aff-fill.high { background:var(--safe); box-shadow:0 0 8px var(--safe); }
  .aff-fill.max { background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .aff-num { font-size:12px; font-family:monospace; color:var(--sub); min-width:32px; text-align:right; }
  .detail-row { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; border-top:1px dashed rgba(255,255,255,0.05); padding-top:8px; }
  .detail-item { font-size:11px; color:var(--sub); }
  .detail-item strong { color:var(--txt); font-weight:500; margin-left:2px; }
  .detail-item.nsfw strong { color:var(--warn); }
  .quest-card {
    background: var(--card-bg);
    border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; margin-bottom:6px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .quest-name { font-size:13px; font-weight:600; color:#a78bfa; }
  .quest-desc { font-size:11px; color:var(--sub); margin-top:2px; }
</style>
</head>
<body>
<div class="panel" id="panel">加载中...</div>
<script>
var NPC_LABELS = { eclipsa:'伊克利普斯', vespera:'维斯佩拉', valentina:'瓦伦蒂娜' };
var SEASON_LABELS = { spring:'春·透明之季', summer:'夏·灰色之季', autumn:'秋·金光之季', winter:'冬·雪狱之季' };
var NPC_ORDER = ['eclipsa','vespera','valentina'];
var STAGE_NAMES = {
  eclipsa: ['寒霜触手的疏离主人','紫色眼眸的偷看与借口','塔楼月下的失速心跳','失控的触手与母性泛滥','触手妈妈的温柔侍奉'],
  vespera: ['蛛矛轻触·管家教程第一课','蜂蜜蛋糕与手把手的温柔陷阱','灶台边失控的心跳','蜘蛛小姐的防线崩塌','分羹者的告白'],
  valentina: ['满身尖刺的笨拙女仆','摔碎茶杯的别扭关心','醋海翻波的傲娇大小姐','虎牙轻咬的投降','乖女儿的日常撒娇']
};
function affStage(key, v) { v=Number(v)||0;var i=v<50?0:v<100?1:v<150?2:v<200?3:4;return STAGE_NAMES[key]?STAGE_NAMES[key][i]:'—'; }
function affCls(v) { if(v<50)return'low';if(v<100)return'mid';if(v<175)return'high';return'max'; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pct(v) { return Math.min(250,Math.max(0,Number(v)||0)); }

function render(sd) {
  var present = (sd.world && Array.isArray(sd.world.present_npc)) ? sd.world.present_npc : [];
  var world = sd.world || { season:'winter', weather:'阴' };
  var quest = sd.quest || { entries:{} };
  var npcs = sd.npc || {};
  var h = '';
  h += '<div class="weather-bar">❄ '+esc(SEASON_LABELS[world.season]||world.season)+' · '+esc(world.weather||'—')+'</div>';
  h += '<div class="section-label">角色亲密度</div>';
  for (var i=0;i<NPC_ORDER.length;i++) {
    var key = NPC_ORDER[i], npc = npcs[key]||{affection:0}, af = pct(npc.affection), isPres = present.indexOf(key)!==-1;
    h += '<div class="npc-card '+(isPres?'present':'absent')+'">';
    h += '<div class="npc-head">';
    h += '<span class="npc-name">'+(isPres?'<span class="status-dot on"></span>':'<span class="status-dot off"></span>')+esc(NPC_LABELS[key])+'</span>';
    h += '<span class="npc-stage">'+affStage(key,af)+'</span></div>';
    h += '<div class="aff-bar-row"><div class="aff-bar"><div class="aff-fill '+affCls(af)+'" style="width:'+(af/250*100)+'%"></div></div><span class="aff-num">'+af+' / 250</span></div>';
    h += '<div class="detail-row">';
    h += '<span class="detail-item">衣着:<strong>'+esc(npc.clothing||'—')+'</strong></span>';
    h += '<span class="detail-item">心情:<strong>'+esc(npc.emotion||'—')+'</strong></span>';
    h += '<span class="detail-item nsfw">胸部:<strong>'+esc(npc.breast_state||'—')+'</strong></span>';
    h += '<span class="detail-item nsfw">私处:<strong>'+esc(npc.vagina_state||'—')+'</strong></span>';
    h += '</div></div>';
  }
  var qe = quest.entries||{}, qk = Object.keys(qe), aq = [];
  for (var j=0;j<qk.length;j++) { var q=qe[qk[j]]||{}; if (q.status==='进行中'||!q.status) aq.push({id:qk[j],data:q}); }
  h += '<div class="section-label">进行中的任务</div>';
  if (aq.length===0) {
    h += '<div style="color:var(--sub);padding:12px;font-size:12px;text-align:center;background:var(--card-bg);border-radius:8px;border:1px solid var(--border);">当前无待办事项</div>';
  } else {
    for (var k=0;k<aq.length;k++) {
      var a=aq[k]; h += '<div class="quest-card"><div><div class="quest-name">'+esc(a.data.name||a.id)+'</div><div class="quest-desc">'+esc(a.data.description||'')+'</div></div></div>';
    }
  }
  h += '<div style="font-size:9px;color:var(--sub);text-align:center;margin-top:8px;">冬港暖风 v2.1.0</div>';
  document.getElementById('panel').innerHTML = h;
}

async function tryRead() {
  if (typeof getVariables === 'function') {
    try { var v = getVariables({type:'message', message_id:'latest'}); if (v && v.stat_data) { render(v.stat_data); return true; } } catch(e) {}
  }
  try {
    if (typeof Mvu !== 'undefined' && Mvu.getMvuData) {
      var md = Mvu.getMvuData({type:'message', message_id:'latest'});
      if (md && md.stat_data) { render(md.stat_data); return true; }
    }
  } catch(e) {}
  return false;
}

var loaded = false;
async function boot() {
  for (var i=0;i<10;i++) {
    var ok = await tryRead();
    if (ok) { loaded=true; return; }
    await new Promise(function(r){setTimeout(r,500);});
  }
  if (typeof getVariables === 'undefined') {
    render({
      world: { season: 'winter', weather: '风雪交加', present_npc: ['eclipsa','valentina'] },
      npc: {
        eclipsa: { affection: 180, clothing: '墨绿色斗篷', emotion: '暗自吃醋', breast_state: '敏感', vagina_state: '紧致' },
        vespera: { affection: 80, clothing: '管家服', emotion: '平静', breast_state: '平缓', vagina_state: '干涩' },
        valentina: { affection: 45, clothing: '蕾丝衬衣', emotion: '警惕', breast_state: '平缓', vagina_state: '干涩' }
      },
      quest: { entries: { 'task1': { name: '安抚吸血鬼', description: '给她准备一杯温热的血红茶', status:'进行中' } } }
    });
  }
}

function refresh() { tryRead(); }
try {
  if (typeof eventOn === 'function') {
    var t = null;
    eventOn('MESSAGE_UPDATED', function() { if(t)clearTimeout(t); t=setTimeout(refresh,500); });
    eventOn('MESSAGE_RECEIVED', function() { setTimeout(refresh,1500); });
    eventOn('VARIABLE_UPDATE_ENDED', function() { setTimeout(refresh,300); });
  }
} catch(e) {}

boot();
</script>
</body>
</html>
